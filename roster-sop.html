<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faulkner County Sheriff's Office Roster</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #eab308; /* Sheriff Gold */
            --border: rgba(255,255,255,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title h1 {
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 5px solid var(--accent);
            padding-left: 15px;
        }

        .title p {
            color: var(--text-dim);
            margin-top: 5px;
            padding-left: 20px;
        }

        /* Search Bar */
        .search-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            width: 300px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
        }

        /* Table Styles */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden; /* For rounded corners */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(0,0,0,0.2);
            padding: 1.2rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1.2rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        /* Rank Badges */
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .rank-command { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .rank-supervisor { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .rank-deputy { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.2); }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .search-box { width: 100%; }
            th, td { padding: 0.8rem; font-size: 0.9rem; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">
                <h1>Faulkner County Sheriff</h1>
                <p>Official Personnel Roster</p>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="Search name or unit..." onkeyup="filterTable()">
        </div>

        <div class="table-container">
            <table id="rosterTable">
                <thead>
                    <tr>
                        <th width="10%">Unit</th>
                        <th width="25%">Name</th>
                        <th width="20%">Rank</th>
                        <th width="25%" class="hide-mobile">Assignment</th>
                        <th width="20%" class="hide-mobile">Hire Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Data extracted from the provided PDF
        const rosterData = [
            { unit: "F-01", name: "D. Snapp", rank: "Chief", assignment: "Department Head", hire: "1/3/26" },
            { unit: "F-03", name: "E. Garcia", rank: "Captain", assignment: "Captain", hire: "1/3/26" },
            { unit: "F-32", name: "D. Baker", rank: "Lieutenant", assignment: "PATROL SUP", hire: "1/3/26" },
            { unit: "F-22", name: "D. Payton", rank: "Lieutenant", assignment: "PATROL SUP", hire: "1/3/26" },
            { unit: "F-53", name: "J. Huff", rank: "Corporal", assignment: "Patrol Asst. Lead", hire: "1/3/26" },
            { unit: "F-51", name: "T. Lewis", rank: "Corporal", assignment: "Patrol Asst. Lead", hire: "1/3/26" },
            { unit: "F-54", name: "J. Watts", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-50", name: "R. Clark", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-55", name: "C. Burt", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-56", name: "B. Will", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-52", name: "C. Hutchins", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-59", name: "A. Miller", rank: "Probationary Deputy", assignment: "FTO Phase", hire: "1/3/26" },
            { unit: "F-58", name: "L. Johnson", rank: "Probationary Deputy", assignment: "FTO Phase", hire: "1/3/26" },
            { unit: "F-57", name: "T. Cooper", rank: "Probationary Deputy", assignment: "FTO Phase", hire: "1/3/26" }
        ];

        const tableBody = document.getElementById('tableBody');

        function getRankClass(rank) {
            if (rank.includes('Chief') || rank.includes('Captain') || rank.includes('Lieutenant')) return 'rank-command';
            if (rank.includes('Corporal') || rank.includes('Sergeant')) return 'rank-supervisor';
            return 'rank-deputy';
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(officer => {
                const row = `
                    <tr>
                        <td style="font-family: monospace; color: var(--accent); font-weight: bold;">${officer.unit}</td>
                        <td style="font-weight: 500;">${officer.name}</td>
                        <td><span class="badge ${getRankClass(officer.rank)}">${officer.rank}</span></td>
                        <td class="hide-mobile" style="color: var(--text-dim);">${officer.assignment}</td>
                        <td class="hide-mobile" style="color: var(--text-dim);">${officer.hire}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const filteredData = rosterData.filter(officer => 
                officer.name.toLowerCase().includes(filter) || 
                officer.unit.toLowerCase().includes(filter) ||
                officer.rank.toLowerCase().includes(filter)
            );
            renderTable(filteredData);
        }

        // Initial Render
        renderTable(rosterData);
    </script>
</body>
</html>
