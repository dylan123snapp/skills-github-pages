        <div id="force" class="document-page">
            <div class="watermark">OFFICIAL USE ONLY</div>
            <div class="doc-header">
                <h1>05.00 Use of Force</h1>
                <div class="doc-meta">
                    Policy: 500.01<br>
                    Ref: AR Code Ann.
                </div>
            </div>
            <p>Deputies shall use only the amount of force that is objectively reasonable to effect an arrest or protect life.</p>
            <ol>
                <li><strong>Officer Presence:</strong> Identification of authority.</li>
                <li><strong>Verbal Direction:</strong> Clear commands.</li>
                <li><strong>Soft Control:</strong> Handcuffing techniques.</li>
                <li><strong>Chemical/Electronic:</strong> OC Spray or Taser (X26). <em>Note: Taser deployment requires a Use of Force Report.</em></li>
                <li><strong>Lethal Force:</strong> Authorized only when there is an imminent threat of death or serious bodily injury to the officer or others.</li>
            </ol>
        </div>

        <div id="cid" class="document-page">
            <div class="watermark">OFFICIAL USE ONLY</div>
            <div class="doc-header">
                <h1>06.00 C.I.D.</h1>
                <div class="doc-meta">
                    Policy: 600.00<br>
                    Div: Investigations
                </div>
            </div>
            <p>The <strong>Criminal Investigation Division (CID)</strong> is responsible for felony case files.</p>
            <ul>
                <li><strong>Dress Code:</strong> Business Casual (Shirt/Tie) or Department Polo. Badge must be visible on belt or neck chain.</li>
                <li><strong>Callout Criteria:</strong> CID shall be notified for:
                    <ul>
                        <li>Homicides / Suspicious Deaths (Signal 7)</li>
                        <li>Officer Involved Shootings</li>
                        <li>Bank Robbery</li>
                        <li>Sexual Assault</li>
                    </ul>
                </li>
            </ul>
        </div>
        
        <div id="civil" class="document-page">
            <div class="watermark">OFFICIAL USE ONLY</div>
            <div class="doc-header">
                <h1>07.00 Civil Process</h1>
                <div class="doc-meta">
                    Policy: 700.00<br>
                    Div: Civil
                </div>
            </div>
            <p>The Sheriff is mandated by Arkansas Law to serve the courts. Civil Process duties include:</p>
            <ul>
                <li><strong>Evictions (Writs of Possession):</strong> Removing tenants after court order.</li>
                <li><strong>Subpoenas:</strong> Serving court dates to witnesses.</li>
                <li><strong>Protective Orders:</strong> Serving restraining orders on subjects.</li>
            </ul>
        </div>
    </div>

    <script>
        // NAVIGATION LOGIC
        // Updated to accept the button element itself ('this') for reliable event handling
        function openDoc(docId, btnElement) {
            // Hide all pages
            const pages = document.querySelectorAll('.document-page');
            pages.forEach(page => page.classList.remove('active'));
            
            // Remove 'active' class from all buttons
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            
            // Show selected page
            document.getElementById(docId).classList.add('active');
            
            // Highlight selected button
            if (btnElement) {
                btnElement.classList.add('active');
            }
        }

        // --- ROSTER LOGIC ---
        const rosterData = [
            { unit: "F-01", name: "D. Snapp", rank: "Chief", assignment: "Department Head", hire: "1/3/26" },
            { unit: "F-03", name: "E. Garcia", rank: "Captain", assignment: "Captain", hire: "1/3/26" },
            { unit: "F-32", name: "D. Baker", rank: "Lieutenant", assignment: "Patrol Supervisor", hire: "1/3/26" },
            { unit: "F-22", name: "D. Payton", rank: "Lieutenant", assignment: "Patrol Supervisor", hire: "1/3/26" },
            { unit: "F-53", name: "J. Huff", rank: "Corporal", assignment: "Patrol Asst. Lead", hire: "1/3/26" },
            { unit: "F-51", name: "T. Lewis", rank: "Corporal", assignment: "Patrol Asst. Lead", hire: "1/3/26" },
            { unit: "F-54", name: "J. Watts", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-50", name: "R. Clark", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-55", name: "C. Burt", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-56", name: "B. Will", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-52", name: "C. Hutchins", rank: "Deputy I", assignment: "General Patrol", hire: "1/3/26" },
            { unit: "F-59", name: "A. Miller", rank: "Probationary", assignment: "FTO Phase", hire: "1/3/26" },
            { unit: "F-58", name: "L. Johnson", rank: "Probationary", assignment: "FTO Phase", hire: "1/3/26" },
            { unit: "F-57", name: "T. Cooper", rank: "Probationary", assignment: "FTO Phase", hire: "1/3/26" }
        ];

        const tableBody = document.getElementById('tableBody');

        function getRankClass(rank) {
            if (rank.includes('Chief') || rank.includes('Captain') || rank.includes('Lieutenant')) return 'rank-command';
            if (rank.includes('Corporal') || rank.includes('Sergeant')) return 'rank-supervisor';
            return 'rank-deputy';
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(officer => {
                const row = `
                    <tr>
                        <td class="unit-id">${officer.unit}</td>
                        <td style="font-weight: bold;">${officer.name}</td>
                        <td><span class="badge ${getRankClass(officer.rank)}">${officer.rank}</span></td>
                        <td>${officer.assignment}</td>
                        <td>${officer.hire}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const filteredData = rosterData.filter(officer => 
                officer.name.toLowerCase().includes(filter) || 
                officer.unit.toLowerCase().includes(filter) ||
                officer.rank.toLowerCase().includes(filter)
            );
            renderTable(filteredData);
        }

        // Initialize Roster
        renderTable(rosterData);
    </script>
