        <div id="vehicles" class="document-page">
            <div class="watermark">OFFICIAL USE ONLY</div>
            <div class="doc-header">
                <h1>04.00 Vehicle Operations</h1>
                <div class="doc-meta">
                    Policy: 400.02<br>
                    Auth: Operations Major
                </div>
            </div>
            <p>This General Order regulates the operation of county-owned vehicles and pursuit tactics.</p>
            <h3>4.1 Emergency Response (Code 3)</h3>
            <div class="restriction-box">
                <strong>RESTRICTION ON LIGHTS & SIRENS</strong><br>
                Deputies are <strong>PROHIBITED</strong> from operating Code 3 (Emergency Lights & Siren) unless:
                <ol>
                    <li>Dispatch or a Supervisor has explicitly authorized it.</li>
                    <li>Responding to a <strong>Life Threatening Emergency</strong> (Officer Down, Signal 8 in progress, Active Shooter).</li>
                </ol>
                <em>Routine calls shall be answered Code 1 (Standard) or Code 2 (Lights only at intersections).</em>
            </div>
            <h3>4.2 Tactical Vehicle Intervention (PIT)</h3>
            <div class="restriction-box">
                <strong>STRICT LIABILITY NOTICE</strong><br>
                The Pursuit Intervention Technique (PIT) constitutes a use of force. It is restricted as follows:
                <ul>
                    <li><strong>Training:</strong> Deputy must hold valid PIT Certification.</li>
                    <li><strong>Equipment:</strong> The patrol unit MUST be equipped with a <strong>Reinforced Pushbar</strong>.</li>
                    <li><strong>Prohibition:</strong> Slicktop units, CID sedans, and units without pushbars are <strong>FORBIDDEN</strong> from attempting PIT maneuvers due to risk of self-disablement.</li>
                </ul>
            </div>

            <h3>4.3 Fleet Assignments (Use of Cars)</h3>
            <div class="policy-box">
                <p>Vehicles are assigned based on rank structure to ensure proper asset allocation. Use the spawn codes below corresponding to your current rank.</p>
                <table>
                    <tr>
                        <th width="30%">Eligible Ranks</th>
                        <th width="40%">Authorized Vehicles</th>
