<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCSO Internal Policy Manual & Roster</title>
    <style>
        :root {
            /* FCSO Official Colors */
            --fcs-gold: #e6b800; 
            --fcs-green: #0e3c26;
            --dark-bg: #1e1e1e;
            --panel-bg: #252525;
            --text-light: #ecf0f1;
            --alert: #e74c3c;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            margin: 0;
            background-color: #121212;
            color: #333;
            display: flex;
            height: 100vh;
        }

        /* --- SIDEBAR STYLING --- */
        .sidebar {
            width: 280px;
            background-color: var(--fcs-green);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 4px solid var(--fcs-gold);
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .header-logo {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(180deg, #051b11 0%, #0e3c26 100%);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-logo svg {
            width: 160px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .header-logo svg:hover {
            transform: scale(1.05);
        }

        .header-logo h2 {
            margin: 5px 0 0 0;
            font-family: 'Arial', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--fcs-gold);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .header-logo p {
            font-size: 0.7rem;
            color: #ccc;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* --- MENU BUTTONS --- */
        .menu {
            padding: 10px;
            overflow-y: auto;
        }

        .menu-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin: 20px 0 5px 15px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-btn {
            display: block;
            width: 95%;
            margin: 0 auto 5px auto;
            padding: 12px 15px;
            background: none;
            border: none;
            text-align: left;
            color: #ddd;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
            transition: 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-btn:hover {
            background-color: rgba(255,255,255,0.1);
            color: white;
            padding-left: 20px;
        }

        .nav-btn.active {
            background-color: var(--fcs-gold);
            color: #0e3c26;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- MAIN DOCUMENT VIEWER --- */
        .viewer {
            flex: 1;
            background-color: #e0e0e0;
            padding: 40px 60px;
            overflow-y: auto;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .document-page {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            min-height: 900px;
            display: none;
            position: relative;
        }

        .document-page.active {
            display: block;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- TYPOGRAPHY --- */
        .doc-header {
            border-bottom: 3px solid #000;
            margin-bottom: 40px;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .doc-header h1 {
            font-size: 28px;
            margin: 0;
            text-transform: uppercase;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -1px;
        }

        .doc-meta {
            text-align: right;
            font-size: 12px;
            color: #666;
            font-family: 'Courier New', monospace;
            line-height: 1.4;
        }

        /* MANUAL SPECIFIC STYLES */
        .manual-container {
            height: 75vh;
            overflow-y: auto;
            padding-right: 15px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 40px;
        }

        .manual-section-title {
            background-color: #0e3c26;
            color: #e6b800;
            padding: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            border-left: 5px solid #e6b800;
        }

        h3 {
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-top: 30px;
            color: var(--fcs-green);
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            font-size: 16px;
        }

        p, li {
            line-height: 1.6;
            font-size: 14px;
        }
        
        ul, ol {
            margin-bottom: 15px;
        }

        .policy-box {
            border: 1px solid #ddd;
            background: #fcfcfc;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            border-left: 5px solid var(--fcs-green);
        }

        .restriction-box {
            border: 1px solid #e74c3c;
            background: #fffafa;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            border-left: 5px solid #c0392b;
        }

        /* --- TABLE STYLES --- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            margin-top: 15px;
            border: 1px solid #eee;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        td {
            border-bottom: 1px solid #eee;
            padding: 10px 12px;
        }

        tr:nth-child(even) { background-color: #f8f9fa; }
        
        /* --- ROSTER SPECIFIC STYLES --- */
        .search-container {
            margin-bottom: 20px;
            text-align: right;
        }

        .search-box {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            font-family: 'Segoe UI', sans-serif;
            border-radius: 4px;
        }
        
        .unit-id {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #000;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            min-width: 80px;
            text-align: center;
        }

        .rank-command { 
            background: var(--fcs-gold); 
            color: #000; 
            border: 1px solid #b38000;
        }
        
        .rank-supervisor { 
            background: var(--fcs-green); 
            color: #fff; 
            border: 1px solid #051b11;
        }

        .rank-deputy { 
            background: #e0e0e0; 
            color: #333; 
            border: 1px solid #ccc;
        }

        .watermark {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 120px;
            color: rgba(0,0,0,0.02);
            pointer-events: none;
            font-weight: 900;
            text-transform: uppercase;
            font-family: 'Arial Black', sans-serif;
            white-space: nowrap;
        }
        
        /* Spawn Code Highlight */
        .code-snippet {
            font-family: 'Courier New', monospace;
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
            font-weight: bold;
            color: #d35400;
        }

    </style>
</head>
