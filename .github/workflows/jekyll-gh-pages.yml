        <div id="fullmanual" class="document-page active">
            <div class="doc-header">
                <h1>Personnel Manual (2018)</h1>
                <div class="doc-meta">
                    Source: Faulkner Co. Policy<br>
                    Status: Full Text<br>
                    Rev: Aug 2018
                </div>
            </div>
            
            <p><strong>Note:</strong> This document contains the full text of the Faulkner County Personnel Manual.</p>
            
            <div class="manual-container">
                <div class="manual-section-title">I. INTRODUCTION</div>
                <p>This Manual is designed to inform Faulkner County employees of the County's operating policies and practices as they apply to all County employees. Additional policies and practices may be adopted by Officials, as defined below, provided that these do not conflict with the policies contained herein. Any additional policies or practices adopted by an Official shall become effective after approval by the Quorum Court. County employees are defined as those deputies and others employed by and serving at the pleasure of the officials. Each County employee is responsible to the official who hires or appoints that employee.</p>

                <div class="manual-section-title">II. DEFINITIONS</div>
                <ul>
                    <li><strong>Constitutionally protected class:</strong> includes race, color, religious creed, sex, or national origin.</li>
                    <li><strong>County:</strong> a political subdivision and corporation within specified geographic limitations which administers justice and exercises local legislative authority.</li>
                    <li><strong>Emergency:</strong> a situation (e.g. injury, loss of life, damage to property, or catastrophic interference with normal activities) that requires immediate attention and remedial action.</li>
                    <li><strong>Employee:</strong> a person who is employed in the service of the county. This definition excludes a person who is required to perform work for a municipality, county, the State, or federal government, upon being convicted of a criminal offense or while incarcerated.</li>
                    <li><strong>Official:</strong> an elected person vested with authority in a County office. This will also refer to the top authority in any department not headed by an elected person.</li>
                    <li><strong>Relative:</strong> husband, wife, mother, father, stepmother, stepfather, mother-in-law, father-in-law, brother, sister, stepbrother, stepsister, half-brother, half-sister, brother-in-law, sister-in-law, daughter, son, step-daughter, step-son, daughter-in-law, son-in-law, uncle, aunt, first cousin, nephew, niece, grandparents, granddaughter, or grandson.</li>
                </ul>

                <div class="manual-section-title">III. EQUAL EMPLOYMENT OPPORTUNITY</div>
                <p><strong>General County Policy:</strong> The county is to treat all employees and citizens in a manner that is rationally related to the effectuation of legitimate County objectives and uniformly applied to all persons similarly situated. No official or employee of the County is to abuse or misuse his or her governmental power. No official or employee is to engage in any overt act that is either illegal or unconstitutional.</p>
                <p>No officer or employee of County government shall be interested, either directly or indirectly, in any contract or transaction made, authorized, or entered into on behalf of the County. No official or employee of County government is to engage in any act that would constitute corruption, gross immorality, criminal conduct, malfeasance, misfeasance, or nonfeasance in office.</p>
                <p><strong>County Employment Policy (At Will):</strong> All County employees are "at will" employees. County employment is not for a specific period of time and may be terminated at any time without notice or liability of any kind (except for wages earned and unpaid) and with or without cause.</p>
                <p><strong>Rational Basis for Removal of Pay or Position:</strong> An Official may reduce or remove pay or position of an employee for any reason that is rationally related to the effectuation of any conceivable legitimate County objective. Examples include: Misrepresentation, dishonesty, Intemperate conduct, Insubordination, Abuse or misuse of position.</p>

                <div class="manual-section-title">IV. RECRUITMENT</div>
                <p>The Human Resource Office shall be notified of the official's intent to hire by means of a "Notice of Job Opening". All full-time positions shall remain open for a minimum of fourteen (14) calendar days before hiring. An open position will close at 11:59 p.m. on the last day it is advertised.</p>

                <div class="manual-section-title">V. SELECTION</div>
                <p>All qualifications required for hiring must be "bona fide" occupational qualifications. Once the application period closes, if an official or department head chooses to screen applicants before interviewing, 10% of the applicants or a minimum of three must be interviewed before a job offer is made.</p>

                <div class="manual-section-title">VI. HIRING</div>
                <p>New employee data shall be submitted by the hiring official to the Human Resource Office within two (2) business days of a job acceptance. The Immigration Reform and Control Act of 1986 requires that persons hired after May 31, 1987 complete a Form I-9 within three (3) business days of the date of hire.</p>

                <div class="manual-section-title">VII. NEPOTISM</div>
                <p>A. An official shall not contract with, hire, appoint for employment, or promote any relative of that official.</p>
                <p>B. An official shall not hire, appoint or promote for employment any relative of any person in the same department or office if either one will have direction or supervision of the other.</p>

                <div class="manual-section-title">VIII. BACKGROUND CHECKS</div>
                <p>Offers of employment at Faulkner County may be contingent upon the results of a background check. Background checks may include: Social Security verification, Prior Employment Verification, State Criminal History, Federal Criminal History, Personal References, Educational Verification, Driving History, and Credit History.</p>

                <div class="manual-section-title">X. PERSONNEL RECORDS</div>
                <p>Personnel Records of all County employees shall be kept by the Human Resource Office. Time Records must be reviewed for accuracy and signed by both the employee and the supervisor.</p>

                <div class="manual-section-title">XV. STANDARD WORKWEEK</div>
                <p>The standard workweek for Faulkner County shall begin at 12:00 A.M. on Saturday and end at 11:59 P.M. the following Friday. The normal work period shall be 40 hours per week for all employees except employees engaged in the provision of law enforcement (including jailer) and ambulance services. The normal work week for law enforcement (including jailer) and ambulance personnel shall be no more than 171 hours in a 28 consecutive day work period.</p>

                <div class="manual-section-title">XVI. SPECIAL COMPENSATION</div>
                <p>Employees who are eligible to receive overtime compensation may, at the discretion of the official, receive, in lieu of over-time pay, compensatory time off at a rate of one and one-half hours for each hour of time worked in excess of the normal work period. No Employee shall accrue more than 120 hours of compensatory time.</p>

                <div class="manual-section-title">XVII. REST PERIODS</div>
                <p>The County provides two (2) fifteen (15) minute paid rest periods each work day.</p>

                <div class="manual-section-title">XVIII. COURTHOUSE CLOSURES</div>
                <p><strong>Inclement Weather:</strong> Employees are expected to work regardless of the weather unless the County Judge declares the County offices officially closed. Employees who are not scheduled to work because of vacation, sick, or other leave will not receive inclement weather pay.</p>
                <p><strong>Holiday Leave:</strong> A paid holiday shall consist of one (1) normal workday. Holidays not taken within one year shall be forfeited. When an employee terminates employment, annual leave as well as holiday leave may not exceed 240 hours.</p>

                <div class="manual-section-title">XIX. GENERAL WORK RULES (CONDUCT)</div>
                <p>Employees who violate any County rule or regulation will be disciplined. The following list includes sufficient cause for disciplinary action:</p>
                <ol>
                    <li>Arrest and conviction on criminal charges.</li>
                    <li>Unauthorized possession of firearms or weapons of any kind on County Property.</li>
                    <li>Intoxication during working hours.</li>
                    <li>Unauthorized possession of County property.</li>
                    <li>Willful destruction of County property.</li>
                    <li>Falsifying County records including time cards.</li>
                    <li>Sleeping during scheduled working hours.</li>
                    <li>Disobedience or insubordination.</li>
                    <li>The use of abusive, threatening, or obscene language.</li>
                    <li>Absenteeism or tardiness.</li>
                    <li>Working unauthorized overtime.</li>
                    <li>Unauthorized disclosure of confidential information.</li>
                </ol>

                <div class="manual-section-title">XX. GENERAL SAFETY RULES</div>
                <p>Possession or unauthorized use of alcoholic beverages, narcotics, or dangerous drugs on County property and reporting or returning to work under the influence of the same is prohibited. Disorderly conduct or horseplay is prohibited. All injuries and accidents must be reported immediately to the employee's supervisor. All employees in a Faulkner County vehicle must wear a seatbelt while the vehicle is in operation.</p>

                <div class="manual-section-title">XXI. DRUG FREE WORKPLACE ACT</div>
                <p>It is the policy of Faulkner County that the unlawful manufacture, distribution, dispensation, possession, or use of a controlled substance in a County agency's workplace is prohibited. Any employee violating this policy will be subject to discipline up to and including termination.</p>

                <div class="manual-section-title">XXII. PUBLIC SAFETY DRUG TESTING</div>
                <p>Safety personnel are subject to testing (Pre-employment, Reasonable Suspicion, Random, Post-accident). Safety personnel includes those who: Carry a firearm, operate an emergency vehicle, or maintain a CDL. Refusal to take a mandated test results in immediate discharge.</p>

                <div class="manual-section-title">XXIII. HARASSMENT POLICY</div>
                <p>Faulkner County is committed to providing a work environment free of unlawful harassment. Unlawful harassment includes verbal conduct (epithets, slurs), visual conduct (derogatory posters), or physical conduct (assault, blocking movement). Employees should provide a written charge to their supervisor or the County Attorney immediately.</p>

                <div class="manual-section-title">XXIV. EMPLOYEE SPEECH POLICY</div>
                <p><strong>Confidential Information:</strong> Employees shall not disclose or divulge any information obtained by virtue of their employment to persons not specifically authorized.</p>
                <p><strong>Political Activity:</strong> Officials and employees are prohibited while on duty or in uniform from making political endorsements.</p>
                <p><strong>Public Criticism:</strong> Public criticism of County operations can undermine public confidence. Employees are encouraged to express criticism to their immediate supervisor.</p>

                <div class="manual-section-title">XXV. ELECTRONICS</div>
                <p>Faulkner County computing systems are provided as tools for furthering government business. All information created, accessed, or stored is property of the county. Restricted activities include: Harassing others, Damaging systems, Violating copyright laws, Accessing resources not related to work.</p>

                <div class="manual-section-title">XXIX. CONCEALED CARRY POLICY</div>
                <p>Any Faulkner County employee or elected official who is licensed to carry a concealed handgun is allowed to carry... on county property in accordance with Act 1259 of 2015. The licensee is still <strong>PROHIBITED</strong> from carrying a weapon in a detention facility, in an office of the Sheriff's Department, in the Justice Building, or in any courtroom without permission from the presiding judge.</p>

                <div class="manual-section-title">XXXVI. VACATION LEAVE</div>
                <p>All regular full-time Faulkner County employees who have worked at least thirty (30) days shall be entitled to take accrued vacation leave with pay. Vacation leave accumulated in excess of two hundred forty (240) hours will be lost as of December 31 each year.</p>
                <ul>
                    <li>0-5 Years: 8 hours/month</li>
                    <li>5-10 Years: 10 hours/month</li>
                    <li>10-15 Years: 12 hours/month</li>
                    <li>15+ Years: 16 hours/month</li>
                </ul>

                <div class="manual-section-title">XXXVII. SICK LEAVE</div>
                <p>Full-time employees accumulate sick leave at the rate of eight (8) hours per month. Sick leave can be accumulated up to a maximum of 480 hours. If an employee is sick for more than three (3) consecutive days, a doctor's note must be provided.</p>

                <div class="manual-section-title">XXXVIII. FAMILY AND MEDICAL LEAVE (FMLA)</div>
                <p>The County will grant up to twelve (12) weeks of unpaid leave per year to employees who need to care for family members, for the birth of a child, or for a serious health condition. To qualify, an employee must have been employed for at least 12 months and worked 1,250 hours.</p>

                <div class="manual-section-title">XXXIX. CATASTROPHIC LEAVE BANK</div>
                <p>Participation is available to full-time employees. An employee becomes a member by contributing eight (8) hours of sick time to the bank annually. CLB days will be granted only in cases of physical, mental, or emotional illness of the employee or immediate family.</p>

                <div class="manual-section-title">XL. BEREAVEMENT LEAVE</div>
                <p>Leave with pay of up to three (3) days may be taken in case of death of an employee's relative. Two additional days for travel may be granted if out-of-state travel is required.</p>

                <div class="manual-section-title">XLI. MILITARY LEAVE</div>
                <p>Full-time employees who are members of the National Guard or reserves shall be granted fifteen (15) days leave annually plus necessary travel time for annual training. Employees are entitled to their regular salary during this 15 day period.</p>

                <div class="manual-section-title">XLII. JURY DUTY</div>
                <p>County employees shall be excused from work with pay for the period of time necessary to fulfill their civic duty when called for jury duty.</p>

                <div class="manual-section-title">XLIV. TERMINATION</div>
                <p>Faulkner County is an at will employer. Employment with Faulkner County may be terminated at any time by the employee or the County for any or for no reason, with or without notice.</p>

                <div class="manual-section-title">XLV. GRIEVANCE</div>
                <p>It is the policy of Faulkner County to give prompt and impartial consideration to the complaints or grievances of its employees.</p>
                <p><strong>Procedure:</strong> When an employee wishes to have a grievance considered, that employee must: Before 4:30 on the third full business day after the incident that gave rise to the grievance, deliver a written grievance to the County Human Resources Officer. The Human Resources office will set a date and time for a hearing, no earlier than 3 business days and no later than 10 business days after receipt.</p>
            </div>
        </div>
        
        <div id="intro" class="document-page">
            <div class="watermark">OFFICIAL USE ONLY</div>
            <div class="doc-header">
                <h1>01.00 Mission Statement</h1>
                <div class="doc-meta">
                    Policy: 100.01<br>
                    Rev: Jan 2026<br>
                    Auth: Sheriff
                </div>
            </div>
            <p><strong>MISSION:</strong> "To improve the quality of life of the citizens of Faulkner County by providing professional Law Enforcement services... through effective and proactive police service."</p>
            <h3>1.1 Code of Ethics</h3>
            <p>As a Deputy Sheriff, my fundamental duty is to serve mankind; to safeguard lives and property; to protect the innocent against deception, the weak against oppression or intimidation, and the peaceful against violence or disorder.</p>
            <h3>1.2 Jurisdiction</h3>
            <p>The Faulkner County Sheriff's Office maintains primary jurisdiction over all unincorporated areas of Faulkner County (approx. 647 sq miles) and concurrent jurisdiction within the City of Conway. Deputies shall assist Conway PD (CPD) upon request.</p>
        </div>

        <div id="ranks" class="document-page">
            <div class="watermark">OFFICIAL USE ONLY</div>
            <div class="doc-header">
                <h1>02.00 Rank Structure</h1>
                <div class="doc-meta">
                    Policy: 200.02<br>
                    Auth: Human Resources
                </div>
            </div>
            <p>The Chain of Command preserves the integrity of operations. All personnel must adhere to the following hierarchy:</p>
            <div class="policy-box">
                <strong>COMMAND STAFF (Gold Badge)</strong>
                <ul>
                    <li><strong>Sheriff:</strong> The elected constitutional officer. Highest authority.</li>
                    <li><strong>Chief Deputy (Colonel):</strong> Second-in-command. Oversees daily operations of all Bureaus.</li>
                    <li><strong>Major:</strong> Bureau Commander (e.g., Operations Bureau, Detention Bureau).</li>
                    <li><strong>Captain:</strong> Division Commander (e.g., Patrol Division, CID).</li>
                </ul>
            </div>
            <div class="policy-box">
                <strong>SUPERVISORY STAFF</strong>
                <ul>
                    <li><strong>Lieutenant:</strong> Watch Commander. Responsible for an entire shift/watch.</li>
                    <li><strong>Sergeant:</strong> Field Supervisor. Primary decision-maker at major scenes.</li>
                </ul>
            </div>
            <div class="policy-box">
                <strong>FIELD PERSONNEL (Silver Badge)</strong>
                <ul>
                    <li><strong>Corporal:</strong> Senior Deputy / Field Training Officer (FTO).</li>
                    <li><strong>Deputy Sheriff:</strong> Sworn officer.</li>
                    <li><strong>Probationary Deputy:</strong> New hire (Must ride with FTO).</li>
                </ul>
            </div>
        </div>

